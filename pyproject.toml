[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ocp-m3u-plugin"
dynamic = ["version"]
description = "OCP youtube stream extractor plugin"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "ocp", "plugin"]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<2.2.0"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-ocp-m3u-plugin"

[project.entry-points."opm.ocp.extractor"]
"ovos-ocp-m3u-plugin" = "ovos_ocp_m3u_plugin:OCPPlaylistExtractor"

[project.entry-points."opm.ocp.extractor.config"]
"ovos-ocp-m3u-plugin.config" = "ovos_ocp_m3u_plugin:OCPPlaylistExtractorConfig"

[tool.setuptools.dynamic]
version = {attr = "ovos_ocp_m3u_plugin.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_ocp_m3u_plugin*"]

[tool.setuptools.package-data]
ovos_ocp_m3u_plugin = [
    "*.json",
]
